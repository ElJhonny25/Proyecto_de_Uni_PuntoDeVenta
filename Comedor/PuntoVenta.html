<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - SOFTWADZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --color-texto: #ffffff; --color-acento: #ff7f2a; --bg-principal: #1a1e24; }
        
        body {
            margin: 0; font-family: 'Montserrat', sans-serif; color: var(--color-texto);
            background-color: var(--bg-principal); background-size: cover; background-position: center; 
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: -1; }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 30px;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .info-mesa { font-size: 24px; font-weight: bold; color: var(--color-acento); letter-spacing: 2px;}
        .btn-volver {
            background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 20px; border-radius: 10px; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .btn-volver:hover { background: #dc3545; border-color: #dc3545; }

        .pos-container { display: flex; flex: 1; overflow: hidden; padding: 15px; gap: 15px; }

        .categorias-panel {
            width: 20%; background: rgba(20,20,20,0.6); backdrop-filter: blur(15px);
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); padding: 15px;
            display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
        }
        .btn-categoria {
            background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1);
            padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: left;
        }
        .btn-categoria:hover, .btn-categoria.active { background: var(--color-acento); transform: translateX(5px); border-color: var(--color-acento);}

        .productos-panel {
            width: 50%; background: rgba(255,255,255,0.02); backdrop-filter: blur(10px);
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
        }

        .control-cantidad-superior {
            background: rgba(0,0,0,0.5); border-radius: 15px; padding: 10px 20px;
            display: flex; align-items: center; justify-content: center; gap: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-circulo {
            width: 40px; height: 40px; border-radius: 50%; border: none; font-size: 24px; font-weight: bold;
            cursor: pointer; background: rgba(255,255,255,0.1); color: white; transition: 0.2s;
            display: flex; justify-content: center; align-items: center;
        }
        .btn-circulo:active { background: var(--color-acento); transform: scale(0.9); }
        .lbl-cantidad { font-size: 22px; font-weight: bold; min-width: 40px; text-align: center; color: var(--color-acento); }

        .grid-productos {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; overflow-y: auto; align-content: start; flex: 1;
        }

        .btn-producto {
            background: rgba(0,0,0,0.5); border: 2px solid transparent; border-radius: 15px;
            padding: 15px 10px; color: white; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            height: 120px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn-producto:hover { border-color: var(--color-acento); transform: scale(1.05); }
        .btn-producto:active { transform: scale(0.95); }
        .precio-badge { background: var(--color-acento); padding: 3px 8px; border-radius: 8px; font-size: 12px; font-weight: bold; margin-top: 8px; }

        .ticket-panel {
            width: 30%; background: rgba(255,255,255,0.95); color: #000;
            border-radius: 20px; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5); font-family: monospace; font-size: 14px;
        }
        .ticket-header { background: #eee; padding: 15px; text-align: center; border-bottom: 2px dashed #ccc; font-weight: bold;}
        .ticket-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .item-comanda { 
            display: flex; align-items: center; justify-content: space-between; 
            border-bottom: 1px solid #ddd; padding-bottom: 8px; gap: 8px;
        }
        .item-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .item-nombre { font-weight: bold; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-precio-unitario { font-size: 11px; color: #666; }
        
        .item-controles { display: flex; align-items: center; gap: 5px; background: #eee; border-radius: 6px; padding: 3px; }
        .btn-mini { 
            width: 24px; height: 24px; border: 1px solid #ccc; border-radius: 4px; 
            background: #fff; cursor: pointer; font-weight: bold; display: flex; justify-content: center; align-items: center;
        }
        .btn-mini:active { background: #ddd; }
        
        .item-total { width: 60px; text-align: right; font-weight: bold; font-size: 14px;}

        .btn-eliminar-item {
            background: #ff4d4d; color: white; border: none; border-radius: 5px;
            width: 26px; height: 26px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }
        .btn-eliminar-item:hover { filter: brightness(1.2); }

        .ticket-total { background: #222; color: white; padding: 20px; font-size: 22px; text-align: right; font-weight: bold; }
        
        .ticket-actions { display: flex; flex-direction: column; padding: 10px; gap: 8px; background: #eee;}
        .btn-accion { padding: 15px; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; color: white;}
        .btn-cocina { background-color: #dc3545; } 
        .btn-accion:hover { filter: brightness(1.1); transform: translateY(-1px);}

    </style>
    
</head>
<body>
    <div class="overlay"></div>

    <div class="top-bar">
        <div class="info-mesa" id="tituloMesa">MESA: --</div>
        <div style="font-weight: 500;" id="nombreMesero">Atiende: --</div>
        <button class="btn-volver" onclick="volverAtras()">⬅ Volver sin Guardar</button>
    </div>

    <div class="pos-container">
        <div class="categorias-panel" id="listaCategorias">
            <div style="text-align: center; color: #aaa; margin-top: 20px;">Cargando...</div>
        </div>

        <div class="productos-panel">
            <div class="control-cantidad-superior">
                <span style="font-weight: 500; color: rgba(255,255,255,0.7);">Cantidad a agregar:</span>
                <button class="btn-circulo" onclick="cambiarMultiplicador(-1)">-</button>
                <span class="lbl-cantidad" id="multiplicadorValor">1</span>
                <button class="btn-circulo" onclick="cambiarMultiplicador(1)">+</button>
            </div>
            <div class="grid-productos" id="listaProductos"></div>
        </div>

        <div class="ticket-panel">
            <div class="ticket-header">
                <h3 style="margin:0 0 5px 0;">SOFTWADZ POS</h3>
                <span id="ticketMesa" style="font-size: 16px;">Mesa --</span><br>
                <span id="ticketFecha" style="font-size: 11px; color: #666;">--/--/---- --:--</span>
            </div>
            
            <div class="ticket-body" id="ticketItems"></div>
            <div class="ticket-total" id="ticketTotal">TOTAL: $0.00</div>

            <div class="ticket-actions">
                <button class="btn-accion btn-cocina" onclick="enviarACocina()">🔥 Enviar a Cocina (Guardar)</button>
            </div>
        </div>
    </div>

   <script>
        let menuCompleto = [];
        
        let cuentaHistorica = []; 
        let cuentaNuevos = [];    
        
        let idCategoriaActiva = null;
        let cantidadGlobal = 1;
        let nombreMesaActual = "";
        let esDomicilio = false; // Variable global para usarla en toda la pantalla

        document.addEventListener("DOMContentLoaded", function() {
            const root = document.documentElement;
            const colorAcento = localStorage.getItem('--color-acento');
            if (colorAcento) root.style.setProperty('--color-acento', colorAcento);
            const savedBg = localStorage.getItem('bgRestaurante');
            if (savedBg) document.body.style.backgroundImage = `url(${savedBg})`;

            let mesero = JSON.parse(localStorage.getItem('meseroActivo'));
            if(mesero) document.getElementById('nombreMesero').innerText = "Atiende: " + mesero.nombre;

            let mesa = JSON.parse(localStorage.getItem('mesaActiva'));
            
            if(mesa && mesa.nombre) {
                nombreMesaActual = mesa.nombre;
                
                // EVALUAMOS SI ES DOMICILIO/LLEVAR
                esDomicilio = nombreMesaActual.toUpperCase().includes('DOMICILIO') || nombreMesaActual.toUpperCase().includes('LLEVAR') || nombreMesaActual.toUpperCase().includes('PEDIDO') || nombreMesaActual.toUpperCase().includes('FOLIO');

                if(esDomicilio) {
                    document.getElementById('tituloMesa').innerText = "ORDEN: " + nombreMesaActual;
                    document.getElementById('ticketMesa').innerText = nombreMesaActual;
                } else {
                    document.getElementById('tituloMesa').innerText = "MESA: " + nombreMesaActual;
                    document.getElementById('ticketMesa').innerText = "Mesa " + nombreMesaActual;
                }

                let cuentaGuardada = localStorage.getItem('cuenta_' + nombreMesaActual);
                if (cuentaGuardada) {
                    cuentaHistorica = JSON.parse(cuentaGuardada);
                    cuentaHistorica.forEach(item => item.impreso = true);
                }
                
                actualizarTicketUI();
                
            } else {
                alert("Error: No se seleccionó ninguna orden o mesa activa.");
                window.location.href = "AdminDashboard.html"; 
                return;
            }

            let hoy = new Date();
            document.getElementById('ticketFecha').innerText = hoy.toLocaleDateString() + " " + hoy.toLocaleTimeString();

            cargarMenuDeBD();
        });

        // Retorna a Comedor o a Pedidos
        function volverAtras() { 
            if(esDomicilio) {
                window.location.href = "../ZonaAdministrativa/PedidosLlevar.html"; 
            } else {
                window.location.href = "Comedor.html"; 
            }
        }

        function cambiarMultiplicador(cambio) {
            cantidadGlobal += cambio;
            if (cantidadGlobal < 1) cantidadGlobal = 1; 
            if (cantidadGlobal > 50) cantidadGlobal = 50; 
            document.getElementById('multiplicadorValor').innerText = cantidadGlobal;
        }

        async function cargarMenuDeBD() {
            try {
                let req = await fetch('cargar_menu.php');
                let res = await req.json();
                
                if(res.message === 'Por favor inicia sesión primero') {
                    alert("Tu sesión caducó por inactividad. Vuelve a ingresar.");
                    window.location.href = "../Pagina_Principal/Pagina_Principal.html"; 
                    return;
                }

                if(res.status === 'success') {
                    menuCompleto = res.productos; 
                    dibujarCategorias(res.categorias);
                }
            } catch (e) { 
                console.error(e);
            }
        }

        function dibujarCategorias(categorias) {
            const panel = document.getElementById('listaCategorias');
            panel.innerHTML = '';
            let btnTodos = document.createElement('button');
            btnTodos.className = 'btn-categoria active';
            btnTodos.innerText = "⭐ Mostrar Todo";
            btnTodos.onclick = () => {
                document.querySelectorAll('.btn-categoria').forEach(b => b.classList.remove('active'));
                btnTodos.classList.add('active'); idCategoriaActiva = null; dibujarProductos();
            };
            panel.appendChild(btnTodos);

            categorias.forEach(cat => {
                let btn = document.createElement('button');
                btn.className = 'btn-categoria'; btn.innerText = cat.NOMBRE;
                btn.onclick = () => {
                    document.querySelectorAll('.btn-categoria').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active'); idCategoriaActiva = cat.ID_CATEGORIA; dibujarProductos();
                };
                panel.appendChild(btn);
            });
            dibujarProductos();
        }

        function dibujarProductos() {
            const panel = document.getElementById('listaProductos');
            panel.innerHTML = '';
            let productosFiltrados = menuCompleto;
            if (idCategoriaActiva !== null) productosFiltrados = menuCompleto.filter(p => p.ID_CATEGORIA == idCategoriaActiva);
            
            if (productosFiltrados.length === 0) return;

            productosFiltrados.forEach(prod => {
                let btn = document.createElement('div');
                btn.className = 'btn-producto';
                btn.innerHTML = `<span style="font-size: 13px; font-weight:bold;">${prod.NOMBRE}</span><div class="precio-badge">$ ${parseFloat(prod.PRECIO).toFixed(2)}</div>`;
                btn.onclick = () => agregarAlTicket(prod, cantidadGlobal);
                panel.appendChild(btn);
            });
        }

        function agregarAlTicket(producto, cantidadAgregar) {
    let itemExistente = cuentaNuevos.find(item => item.id == producto.ID_PRODUCTO);

    if (itemExistente) {
        itemExistente.cantidad += cantidadAgregar;
        itemExistente.subtotal = itemExistente.cantidad * parseFloat(producto.PRECIO);
    } else {
        cuentaNuevos.push({
            id: producto.ID_PRODUCTO,
            nombre: producto.NOMBRE,
            precioUnitario: parseFloat(producto.PRECIO),
            cantidad: cantidadAgregar,
            subtotal: cantidadAgregar * parseFloat(producto.PRECIO),
            categoria: producto.CATEGORIA || 'COCINA GENERAL',
            comentario: '' // inicialmente sin comentario
        });
    }
    cantidadGlobal = 1;
    document.getElementById('multiplicadorValor').innerText = cantidadGlobal;
    actualizarTicketUI();
}

        function ajustarCantidad(idProducto, cambio) {
            let itemIndex = cuentaNuevos.findIndex(item => item.id == idProducto);
            if (itemIndex > -1) {
                cuentaNuevos[itemIndex].cantidad += cambio;
                if (cuentaNuevos[itemIndex].cantidad <= 0) cuentaNuevos.splice(itemIndex, 1);
                else cuentaNuevos[itemIndex].subtotal = cuentaNuevos[itemIndex].cantidad * cuentaNuevos[itemIndex].precioUnitario;
                actualizarTicketUI();
            }
        }

        function quitarDelTicket(idProducto) {
            cuentaNuevos = cuentaNuevos.filter(item => item.id != idProducto);
            actualizarTicketUI();
        }

        function actualizarTicketUI() {
            const panel = document.getElementById('ticketItems');
            panel.innerHTML = ''; let totalNuevos = 0;

            if(cuentaNuevos.length === 0) {
                panel.innerHTML = '<div style="text-align:center; color:#aaa; margin-top:20px;">No hay comandas nuevas</div>';
            } else {
                cuentaNuevos.forEach((item, index) => {
    totalNuevos += item.subtotal;
    let div = document.createElement('div');
    div.className = 'item-comanda';

    // Mostrar comentario si existe
    let comentarioHTML = item.comentario ? `<div style="font-size:10px; color:var(--color-acento); font-style:italic;">${item.comentario}</div>` : '';

    div.innerHTML = `
        <div class="item-info">
            <span class="item-nombre">${item.nombre}</span>
            <span class="item-precio-unitario">P.U: $${item.precioUnitario.toFixed(2)}</span>
            ${comentarioHTML}
        </div>
        <div class="item-controles">
            <button class="btn-mini" onclick="ajustarCantidad('${item.id}', -1)">-</button>
            <span style="font-weight:bold; min-width: 18px; text-align:center;">${item.cantidad}</span>
            <button class="btn-mini" onclick="ajustarCantidad('${item.id}', 1)">+</button>
        </div>
        <span class="item-total">$${item.subtotal.toFixed(2)}</span>
        <button class="btn-eliminar-item" onclick="quitarDelTicket('${item.id}')">X</button>
        <button style="background:transparent; border:none; cursor:pointer; font-size:16px;" onclick="editarComentario(${index})">✏️</button>
    `;
    panel.appendChild(div);
});
            }
            document.getElementById('ticketTotal').innerText = `POR ENVIAR: $${totalNuevos.toFixed(2)}`;
        }

        async function enviarACocina() {
            if (cuentaNuevos.length === 0) {
                return alert("No hay productos nuevos para enviar a cocina.");
            }

            let formData = new FormData();
            formData.append('mesa', nombreMesaActual);
            formData.append('productos', JSON.stringify(cuentaNuevos)); 

            try {
                let respuesta = await fetch('guardar_comanda.php', { method: 'POST', body: formData });
                let data = await respuesta.json();

                if (data.status !== 'success') {
                    if(data.message && data.message.includes('sesión')) {
                         alert("Tu sesión caducó por inactividad. Vuelve a ingresar.");
                         window.location.href = "../Pagina_Principal/Pagina_Principal.html"; 
                         return;
                    }
                    return alert("Error en Base de Datos: " + data.message);
                }

                // --- IMPRESIÓN EN COCINA ---
                let categorias = {};
                cuentaNuevos.forEach(item => {
                    let cat = item.categoria || 'COCINA GENERAL'; 
                    if (!categorias[cat]) categorias[cat] = []; 
                    categorias[cat].push(item);
                });

                let fecha = new Date().toLocaleString('es-MX');
                let delay = 0; 

                for (let cat in categorias) {
                    setTimeout(() => {
                        let itemsHTML = "";
                        categorias[cat].forEach(i => {
    let descripcion = i.nombre;
    if (i.comentario) descripcion += `<br><span style="font-size:10px; font-weight:normal;">→ ${i.comentario}</span>`;
    itemsHTML += `
        <tr>
            <td style="width: 25%; text-align: center; font-size: 18px; white-space: nowrap; vertical-align: top; padding-right: 5px;"><b>[${i.cantidad}]</b></td>
            <td style="width: 75%; font-size: 16px; font-weight: bold; text-align: left; vertical-align: top; line-height: 1.2;">${descripcion}</td>
        </tr>
    `;
});

                        let formatoIndividual = `
                            <html>
                            <head><style>@media print { @page { margin: 0; size: 58mm auto; } body { margin: 0; } } body { font-family: 'Courier New', monospace; width: 48mm; color: #000; background: #fff; margin: 0 auto; }</style></head>
                            <body>
                                <div style="text-align: center; font-weight: bold; font-size: 16px; border-bottom: 2px solid #000; margin-bottom: 5px; padding-bottom: 5px;">*** ${cat.toUpperCase()} ***</div>
                                <div style="font-size: 12px; margin-bottom: 10px;">
                                    MESA/ORDEN: <b>${nombreMesaActual}</b><br>
                                    FOLIO: <b>${data.folio}</b><br>
                                    FECHA: ${fecha}
                                </div>
                                <table style="width: 100%; border-collapse: collapse;">
                                    <thead><tr style="border-bottom: 1px dashed #000;"><th style="text-align: center;">CANT</th><th style="text-align: left; padding-left: 5px;">DESC</th></tr></thead>
                                    <tbody>${itemsHTML}</tbody>
                                </table>
                                <div style="text-align: center; margin-top: 15px; margin-bottom: 5mm; font-size: 10px;">- Fin de orden ${cat} -</div>
                            </body>
                            </html>
                        `;

                        let ventana = window.open('', '_blank', 'width=400,height=600');
                        ventana.document.write(formatoIndividual);
                        ventana.document.close();
                        ventana.focus();
                        setTimeout(() => { ventana.print(); ventana.close(); }, 500);
                    }, delay);
                    delay += 1500; 
                }

                // --- GUARDAR EN MEMORIA LOCAL Y BASE DE DATOS ---
                let cuentaFinal = cuentaHistorica.concat(cuentaNuevos);
                localStorage.setItem('cuenta_' + nombreMesaActual, JSON.stringify(cuentaFinal));
                
                cuentaNuevos = []; 
                
                // ACTUALIZAR ESTADO EN LA BASE DE DATOS
                let nuevoEstado = esDomicilio ? 'preparando' : 'ocupada';
                
                // Actualizar localStorage (solo para uso local inmediato)
                localStorage.setItem('estado_' + nombreMesaActual, nuevoEstado);
                
                // Llamar al endpoint que actualiza la base de datos (fuente de verdad)
                let formEstado = new FormData();
                formEstado.append('mesa', nombreMesaActual);
                formEstado.append('estado', nuevoEstado);
                fetch('actualizar_estado_mesa.php', { method: 'POST', body: formEstado });

                // Redirigir tras las impresiones
                setTimeout(() => {
                    volverAtras();
                }, delay + 500);

            } catch (error) {
                console.error(error);
                alert("Error de conexión al servidor.");
            }
        }

        async function editarComentario(index) {
    const item = cuentaNuevos[index];
    const comentarioActual = item.comentario || '';
    const nuevo = await mostrarPrompt('Agregar especificación:', '✏️', comentarioActual);
    if (nuevo !== null) {
        item.comentario = nuevo.trim();
        actualizarTicketUI();
    }
}
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/notificaciones.js"></script>
</body>
</html>
