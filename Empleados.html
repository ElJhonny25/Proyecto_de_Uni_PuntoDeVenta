<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personal - SOFTWADZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #e6e6e6; /* var(--bg-principal) */
            font-family: 'Montserrat', sans-serif;
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .form-container {
            background-color: #4a4a4a; /* var(--bg-paneles) */
            padding: 40px; border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%; max-width: 500px; color: white;
        }
        h2 { text-align: center; color: #ff7f2a; margin-top: 0; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; }
        
        .form-input {
            width: 100%; padding: 12px; border-radius: 5px;
            border: none; box-sizing: border-box; font-family: 'Montserrat', sans-serif;
        }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 5px;
            font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px;
            transition: filter 0.2s; font-family: 'Montserrat', sans-serif;
        }
        .btn-guardar { background-color: #ff7f2a; color: white; }
        .btn-volver { background-color: #5bc0de; color: white; text-decoration: none; display: block; text-align: center; margin-top: 15px;}
        .btn:hover { filter: brightness(1.1); }

        /* Estilos para previsualizar la foto */
        .foto-preview {
            width: 120px; height: 120px; border-radius: 50%; background-color: #ccc;
            margin: 0 auto 15px auto; display: block; object-fit: cover; border: 3px solid #ff7f2a;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Registro de Nuevo Empleado</h2>

        <img id="previewImg" class="foto-preview" src="https://via.placeholder.com/120?text=Foto" alt="Vista previa">

        <div class="form-group">
            <label>Fotografía del Empleado (Opcional)</label>
            <input type="file" id="foto" class="form-input" accept="image/*" style="background-color: white; padding: 9px;" onchange="previsualizarFoto(event)">
        </div>

        <div class="form-group">
            <label>Nombre(s) *</label>
            <input type="text" id="nombre" class="form-input" placeholder="Ej. Carlos">
        </div>

        <div class="form-group">
            <label>Apellido Paterno *</label>
            <input type="text" id="apellido_p" class="form-input" placeholder="Ej. Ramirez">
        </div>

        <div class="form-group">
            <label>Apellido Materno</label>
            <input type="text" id="apellido_m" class="form-input" placeholder="Ej. Lopez (Opcional)">
        </div>

        <div class="form-group">
            <label>NIP de Acceso (Solo números) *</label>
            <input type="number" id="nip" class="form-input" placeholder="Ej. 1234">
        </div>

        <div class="form-group">
            <label>Cargo del Empleado *</label>
            <select id="cargo" class="form-input">
                <option value="1">Mesero</option>
                <option value="2">Capitán de meseros</option>
                <option value="3">Administrador</option>
                <option value="4">Gerente</option>
            </select>
        </div>

        <button class="btn btn-guardar" onclick="guardarEmpleado()">Registrar Empleado</button>
        <a href="Pagina_Principal.html" class="btn btn-volver">Cancelar / Volver</a>

    </div>

    <script>
        // Función para mostrar la imagen seleccionada antes de guardarla
        function previsualizarFoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImg').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        // Función para convertir la foto a Base64 de forma asíncrona
        function leerFotoBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // Función principal para enviar datos a PHP
        async function guardarEmpleado() {
            let nombre = document.getElementById('nombre').value;
            let apellido_p = document.getElementById('apellido_p').value;
            let apellido_m = document.getElementById('apellido_m').value;
            let nip = document.getElementById('nip').value;
            let id_cargo = document.getElementById('cargo').value;
            let fotoInput = document.getElementById('foto').files[0];

            if (!nombre || !apellido_p || !nip) {
                alert("Por favor, llena los campos obligatorios (*).");
                return;
            }

            // Deshabilitar botón para evitar doble clic
            const btn = document.querySelector('.btn-guardar');
            btn.innerText = "Guardando...";
            btn.disabled = true;

            let fotoBase64 = null;
            if (fotoInput) {
                fotoBase64 = await leerFotoBase64(fotoInput); 
            }

            let datos = {
                nombre: nombre,
                apellido_p: apellido_p,
                apellido_m: apellido_m,
                nip: nip,
                id_cargo: id_cargo,
                foto: fotoBase64
            };

            try {
                let respuesta = await fetch('guardar_empleado.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                let resultado = await respuesta.json();
                
                if (resultado.status === 'success') {
                    alert(resultado.message);
                    // Limpiar el formulario
                    document.getElementById('nombre').value = '';
                    document.getElementById('apellido_p').value = '';
                    document.getElementById('apellido_m').value = '';
                    document.getElementById('nip').value = '';
                    document.getElementById('foto').value = '';
                    document.getElementById('previewImg').src = 'https://via.placeholder.com/120?text=Foto';
                } else {
                    alert(resultado.message); // Muestra error si el NIP ya existe, etc.
                }
            } catch (error) {
                console.error(error);
                alert("Hubo un problema de conexión con el servidor.");
            } finally {
                // Restaurar botón
                btn.innerText = "Registrar Empleado";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
