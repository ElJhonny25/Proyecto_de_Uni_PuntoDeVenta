<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFTWADZ - Punto de Venta</title>
    <link rel="stylesheet" href="Diseño_Pagina_Principal.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        .uploaded-logo-image {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="action-btn active" onclick="irARegistroPersonal()">Ingresar<br>nuevo<br>personal</button>
        <button class="action-btn" onclick="gestionarPersonal()">Gestionar<br>personal</button>
        <button class="action-btn" onclick="abrirTurno()">Abrir<br>turno</button>
        <button class="action-btn" onclick="cerrarTurno()">Cerrar<br>turno</button>
        <button class="action-btn" onclick="openSettings()">Editar<br>Interfaz</button>
    </div>

    <div class="main-content">
        <div class="logo-section">
            <div class="logo-disk" id="logoDisk">
                <div id="logoText" class="logo-text-area">
                    <span class="logo-text-orange">Tu Logo</span>
                    <span class="logo-text-white">Aquí</span>
                </div>
                <img id="uploadedLogo" class="uploaded-logo-image" src="" alt="Logo del Restaurante" style="display:none;">
                <input type="file" id="logoInput" accept="image/*" style="display:none;">
                <label for="logoInput" class="upload-logo-control">
                    <span class="upload-logo-icon">📷</span>
                    <span>Cargar Logo</span>
                </label>
            </div>
        </div>

        <div class="login-section">
            <input type="password" class="pin-display" id="pinInput" readonly placeholder="• • • • •">
            <div class="keypad">
                <button class="key" onclick="addNumber('1')">1</button>
                <button class="key" onclick="addNumber('2')">2</button>
                <button class="key" onclick="addNumber('3')">3</button>
                <button class="key" onclick="addNumber('4')">4</button>
                <button class="key" onclick="addNumber('5')">5</button>
                <button class="key" onclick="addNumber('6')">6</button>
                <button class="key" onclick="addNumber('7')">7</button>
                <button class="key" onclick="addNumber('8')">8</button>
                <button class="key" onclick="addNumber('9')">9</button>
                <button class="key key-0" onclick="addNumber('0')">0</button>
                <button class="key" onclick="deleteNumber()" style="background-color: #ffcccc; color: #cc0000; font-size: 26px;">⌫</button>
            </div>
            <button class="enter-btn" onclick="submitPin()">Ingresar</button>
        </div>
    </div>

    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <h2>Tema Visual</h2>
            <div class="color-control"><span>Fondo General:</span><input type="color" id="colorBgPrincipal" value="#e6e6e6"></div>
            <div class="color-control"><span>Paneles y Botones:</span><input type="color" id="colorBgPaneles" value="#4a4a4a"></div>
            <div class="color-control"><span>Color de Acento:</span><input type="color" id="colorAcento" value="#ff7f2a"></div>
            <div class="color-control"><span>Fondo de Teclas:</span><input type="color" id="colorBgTeclas" value="#ffffff"></div>
            <button class="close-settings-btn" onclick="closeSettings()">Guardar y Cerrar</button>
            <button class="close-settings-btn" onclick="resetColors()" style="background-color: #d9534f; margin-top: 5px;">Restaurar Colores</button>
        </div>
    </div>

    <script>
        // --- GESTIÓN DE PERSONAL (Redirecciones seguras) ---
        function irARegistroPersonal() {
            let pass = prompt("Ingrese contraseña de administrador para registrar personal:");
            if (pass === "1234") { 
                window.location.href = "Empleados.html";
            } else if (pass !== null) {
                alert("Contraseña incorrecta.");
            }
        }

        function gestionarPersonal() {
            let pass = prompt("Ingrese contraseña de administrador para gestionar personal:");
            if (pass === "1234") {
                window.location.href = "Eliminar_empleado.php";
            } else if (pass !== null) {
                alert("Contraseña incorrecta.");
            }
        }

        // --- LÓGICA DEL TECLADO E INICIO DE SESIÓN ---
        const pinInput = document.getElementById('pinInput');
        function addNumber(num) { if (pinInput.value.length < 6) pinInput.value += num; }
        function deleteNumber() { pinInput.value = pinInput.value.slice(0, -1); }

        async function submitPin() {
            let nipIngresado = pinInput.value;
            if(nipIngresado.length > 0) {
                try {
                    let respuesta = await fetch('validar_login.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nip: nipIngresado })
                    });
                    let resultado = await respuesta.json();

                    if (resultado.status === 'success') {
                        // Guardamos datos y foto en memoria para mostrarlos en el comedor
                        localStorage.setItem('meseroActivo', JSON.stringify(resultado.empleado));
                        window.location.href = "Comedor.html"; 
                    } else {
                        alert(resultado.message);
                        pinInput.value = ''; 
                    }
                } catch (error) {
                    alert("Error al conectar con la base de datos SOFTWADZ.");
                }
            }
        }

        // --- LÓGICA DE TURNOS ---
        async function abrirTurno() {
            let nip = prompt("Ingrese su NIP de empleado para ABRIR el turno:");
            if (nip && nip.trim() !== "") {
                try {
                    let req = await fetch('abrir_turno.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nip: nip })
                    });
                    let res = await req.json();
                    if (res.status === 'success') alert(res.message + "\nFecha y Hora: " + res.hora);
                    else alert("Aviso: " + res.message);
                } catch (e) { alert("Error al conectar con el servidor."); }
            }
        }

        async function cerrarTurno() {
            let nip = prompt("Ingrese su NIP de empleado para CERRAR el turno:");
            if (nip && nip.trim() !== "") {
                try {
                    let req = await fetch('cerrar_turno.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nip: nip })
                    });
                    let res = await req.json();
                    if (res.status === 'success') alert(res.message + "\nCierre: " + res.hora);
                    else alert("Aviso: " + res.message);
                } catch (e) { alert("Error al conectar con el servidor."); }
            }
        }

        // --- UI VISUAL (Logos y Colores) ---
        const logoInput = document.getElementById('logoInput');
        const logoText = document.getElementById('logoText');
        const uploadedLogo = document.getElementById('uploadedLogo');
        const logoDisk = document.getElementById('logoDisk');

        function loadSavedLogo() {
            const savedLogo = localStorage.getItem('logoRestaurante');
            if (savedLogo) {
                uploadedLogo.src = savedLogo;
                logoText.style.display = 'none';
                uploadedLogo.style.display = 'block';
                logoDisk.style.transform = 'none';
                logoDisk.style.backgroundColor = 'transparent';
            }
        }

        logoInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    uploadedLogo.src = base64Image;
                    logoText.style.display = 'none';
                    uploadedLogo.style.display = 'block';
                    logoDisk.style.transform = 'none';
                    logoDisk.style.backgroundColor = 'transparent'; 
                    localStorage.setItem('logoRestaurante', base64Image);
                }
                reader.readAsDataURL(file);
            }
        });

        const root = document.documentElement;
        const colorInputs = {
            'colorBgPrincipal': '--bg-principal', 'colorBgPaneles': '--bg-paneles',
            'colorAcento': '--color-acento', 'colorBgTeclas': '--bg-teclas'
        };

        function loadSavedColors() {
            for (const [inputId, cssVar] of Object.entries(colorInputs)) {
                const savedColor = localStorage.getItem(cssVar);
                const inputElement = document.getElementById(inputId);
                if (savedColor) {
                    root.style.setProperty(cssVar, savedColor);
                    inputElement.value = savedColor;
                }
                inputElement.addEventListener('input', function(e) {
                    const newColor = e.target.value;
                    root.style.setProperty(cssVar, newColor);
                    localStorage.setItem(cssVar, newColor); 
                });
            }
        }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        
        function resetColors() {
            for (const cssVar of Object.values(colorInputs)) localStorage.removeItem(cssVar);
            localStorage.removeItem('logoRestaurante');
            location.reload(); 
        }

        loadSavedColors();
        loadSavedLogo();
    </script>
</body>
</html>
