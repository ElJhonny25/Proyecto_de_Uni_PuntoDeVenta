<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja / Punto de Cobro - SOFTWADZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --color-texto: #ffffff; --color-acento: #ff7f2a; --bg-principal: #1a1e24; }
        
        body { margin: 0; font-family: 'Montserrat', sans-serif; color: var(--color-texto); background-color: var(--bg-principal); background-size: cover; background-position: center; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: -1; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .titulo-caja { font-size: 24px; font-weight: bold; color: var(--color-acento); letter-spacing: 2px;}
        .btn-volver { background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 10px 20px; border-radius: 10px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn-volver:hover { background: #dc3545; border-color: #dc3545; }

        .caja-container { display: flex; flex: 1; overflow: hidden; padding: 20px; gap: 20px; }

        /* PANEL DE MESAS */
        .mesas-panel { width: 35%; background: rgba(20,20,20,0.6); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .mesas-panel h3 { margin-top: 0; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px;}

        .btn-mesa-cobro { background: rgba(0, 0, 0, 0.4); border: 2px solid rgba(255,255,255,0.1); color: white; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
        .btn-mesa-cobro.ocupada { border-color: #dc3545; background: rgba(220, 53, 69, 0.1); }
        .btn-mesa-cobro.sucia { border-color: #ffc107; background: rgba(255, 193, 7, 0.1); }
        .btn-mesa-cobro:hover, .btn-mesa-cobro.active { transform: scale(1.02); filter: brightness(1.3); }
        .btn-mesa-cobro.active { border-width: 3px; box-shadow: 0 0 15px var(--color-acento); }
        .badge-total { background: #000; padding: 5px 10px; border-radius: 8px; font-family: monospace; font-size: 16px;}

        /* PANEL DE PAGO */
        .pago-panel { width: 65%; display: flex; gap: 20px; }
        .ticket-panel { flex: 1; background: rgba(255,255,255,0.95); color: #000; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: -10px 0 30px rgba(0,0,0,0.5); font-family: monospace; }
        .ticket-header { background: #eee; padding: 15px; text-align: center; border-bottom: 2px dashed #ccc; font-weight: bold; font-size: 18px;}
        .ticket-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 15px;}
        .item-comanda { display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .ticket-total { background: #222; color: white; padding: 20px; font-size: 28px; text-align: right; font-weight: bold; }

        .cobro-panel { flex: 1; background: rgba(20,20,20,0.6); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        
        /* ALERTA DE RESTRICCIÓN */
        .alerta-impresion { display: none; background: rgba(220, 53, 69, 0.2); border: 1px solid #dc3545; color: #ff6b6b; padding: 10px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: bold; }

        .info-group { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .info-group label { display: block; font-size: 11px; color: #aaa; text-transform: uppercase; margin-bottom: 4px;}
        .input-pago { width: 100%; background: #000; color: #fff; border: 2px solid var(--color-acento); padding: 10px; border-radius: 8px; font-size: 22px; text-align: right; font-weight: bold; box-sizing: border-box; font-family: monospace;}
        .input-pago:disabled { border-color: #555; color: #888; background: #222; cursor: not-allowed; }

        .billetes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .btn-billete { background: #28a745; color: white; border: none; padding: 12px 0; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s;}
        .btn-billete:hover:not(:disabled) { filter: brightness(1.2); }
        .btn-billete:disabled { background: #444; color: #777; cursor: not-allowed; }
        
        .valor-cambio { font-size: 28px; font-weight: bold; text-align: right; color: #28a745; font-family: monospace;}

        .actions-footer { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .btn-action-main { padding: 18px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-print { background: #ffc107; color: #000; }
        .btn-pay { background: #007bff; color: white; }
        .btn-action-main:disabled { background: #444; color: #888; cursor: not-allowed; }
        .btn-action-main:not(:disabled):hover { transform: scale(1.02); filter: brightness(1.1); }
    </style>
    
</head>
<body>
    <div class="overlay"></div>
    <div class="top-bar">
        <div class="titulo-caja">CAJA / PUNTO DE COBRO</div>
        <button class="btn-volver" onclick="window.location.href='AdminDashboard.html'">⬅ Volver</button>
    </div>

    <div class="caja-container">
        <div class="mesas-panel">
            <h3>Cuentas Pendientes</h3>
            <div id="listaMesasPendientes"></div>
        </div>

        <div class="pago-panel">
            <div class="ticket-panel">
                <div class="ticket-header" id="ticketMesaTitulo">Seleccione una Mesa</div>
                <div class="ticket-body" id="ticketItemsCaja">
                    <div style="text-align:center; color:#888; margin-top:50px;">Sin detalles.</div>
                </div>
                <div class="ticket-total" id="ticketTotalCaja">TOTAL: $0.00</div>
            </div>

            <div class="cobro-panel">
                <div class="alerta-impresion" id="alertaImpresion">⚠️ DEBE IMPRIMIR LA CUENTA ANTES DE COBRAR</div>

                <div class="info-group">
                    <label>Efectivo Recibido ($)</label>
                    <input type="number" id="inputRecibido" class="input-pago" placeholder="0.00" onkeyup="calcularCambio()" disabled>
                </div>

                <div class="billetes-grid">
                    <button class="btn-billete" onclick="sumarEfectivo(50)" disabled>$50</button>
                    <button class="btn-billete" onclick="sumarEfectivo(100)" disabled>$100</button>
                    <button class="btn-billete" onclick="sumarEfectivo(200)" disabled>$200</button>
                    <button class="btn-billete" onclick="sumarEfectivo(500)" disabled>$500</button>
                    <button class="btn-billete" onclick="sumarEfectivo(1000)" disabled>$1000</button>
                    <button class="btn-billete" onclick="limpiarEfectivo()" disabled style="background: #dc3545;">CLR</button>
                </div>

                <div class="info-group">
                    <label>Cambio a entregar</label>
                    <div class="valor-cambio" id="lblCambio">$0.00</div>
                </div>

                <div class="actions-footer">
                    <button class="btn-action-main btn-print" id="btnImprimir" disabled onclick="imprimirPrecuenta()">🖨️ Imprimir Cuenta</button>
                    <button class="btn-action-main btn-pay" id="btnCobrar" disabled onclick="procesarCobroFinal()">💵 Cobrar y Liberar</button>
                </div>
            </div>
        </div>
    </div>

    <iframe id="marcoImpresora" style="display:none;"></iframe>

    <script>
        let mesaSeleccionada = null;
        let totalAPagar = 0;
        let estadoMesaSeleccionada = null;
        let itemsActuales = [];
        let folioActivo = null; 
        let actualizandoMesas = false; 

        document.addEventListener("DOMContentLoaded", function() {
            cargarMesasPendientes();
            setInterval(cargarMesasPendientes, 1000); 
        });

        async function cargarMesasPendientes() {
            if (actualizandoMesas) return;
            actualizandoMesas = true;

            try {
                let req = await fetch('../Comedor/cargar_comedor.php');
                let res = await req.json();
                
                if(res.status === 'success') {
                    const panel = document.getElementById('listaMesasPendientes');
                    const mesasFiltradas = res.mesas.filter(m => m.estado === 'ocupada' || m.estado === 'sucia');

                    if (mesasFiltradas.length === 0) {
                        panel.innerHTML = '<div style="text-align: center; color: #aaa; margin-top: 20px;">No hay cuentas activas.</div>';
                        actualizandoMesas = false;
                        return;
                    }

                    let peticiones = mesasFiltradas.map(async (m) => {
                        try {
                            let cuentaReq = await fetch(`../Comedor/cargar_cuenta_mesa.php?mesa=${encodeURIComponent(m.nombre)}`);
                            let cuentaRes = await cuentaReq.json();
                            return { mesa: m, data: cuentaRes };
                        } catch(e) {
                            return null;
                        }
                    });

                    let resultados = await Promise.all(peticiones);
                    let fragmento = document.createDocumentFragment();

                    resultados.forEach(item => {
                        if(!item) return; 
                        
                        let m = item.mesa;
                        let cuentaRes = item.data;

                        let totalMesa = 0;
                        if (cuentaRes.status === 'success') {
                            totalMesa = parseFloat(cuentaRes.total);
                        }

                        let btn = document.createElement('button');
                        btn.className = `btn-mesa-cobro ${m.estado}`;
                        btn.id = 'btn-mesa-' + m.nombre;
                        btn.innerHTML = `MESA ${m.nombre} <span class="badge-total">$${totalMesa.toFixed(2)}</span>`;
                        
                        btn.onclick = () => cargarDetalle(m.nombre, totalMesa, m.estado, cuentaRes.folio, cuentaRes.items);
                        
                        if (mesaSeleccionada === m.nombre) {
                            btn.classList.add('active');
                        }

                        fragmento.appendChild(btn);
                    });

                    panel.innerHTML = '';
                    panel.appendChild(fragmento);
                }
            } catch(e) { 
                console.error("Error al cargar mesas", e); 
            } finally {
                actualizandoMesas = false; 
            }
        }

        // --- CARGAR PLATILLOS DE LA MESA SELECCIONADA ---
        function cargarDetalle(nombre, total, estado, folio, items) {
            mesaSeleccionada = nombre;
            totalAPagar = total;
            estadoMesaSeleccionada = estado;
            folioActivo = folio; 
            itemsActuales = items || []; 

            document.querySelectorAll('.btn-mesa-cobro').forEach(b => b.classList.remove('active'));
            let botonParaActivar = document.getElementById('btn-mesa-' + nombre);
            if(botonParaActivar) {
                botonParaActivar.classList.add('active');
            }

            document.getElementById('ticketMesaTitulo').innerText = `Cuenta ${nombre} (Folio ${folio || 'N/A'})`;
            document.getElementById('ticketTotalCaja').innerText = `TOTAL: $${total.toFixed(2)}`;

            let html = "";
            if (itemsActuales.length > 0) {
                itemsActuales.forEach(i => {
                    let cant = i.CANTIDAD || i.cantidad || 0;
                    let nom = i.NOMBRE || i.nombre || 'Producto';
                    let sub = i.SUBTOTAL || i.subtotal || 0;
                    
                    html += `<div class="item-comanda"><span>${cant}x ${nom}</span><span>$${parseFloat(sub).toFixed(2)}</span></div>`;
                });
            } else {
                html = '<div style="text-align:center; color:#888; margin-top:50px;">Sin detalles (Ocurrió un error al cargar).</div>';
            }
            document.getElementById('ticketItemsCaja').innerHTML = html;

            const isImpresa = (estado === 'sucia'); 
            
            document.getElementById('btnImprimir').disabled = false; 
            document.getElementById('alertaImpresion').style.display = isImpresa ? 'none' : 'block';
            
            document.getElementById('inputRecibido').disabled = !isImpresa;
            document.querySelectorAll('.btn-billete').forEach(b => b.disabled = !isImpresa);
            
            limpiarEfectivo();
        }

        function sumarEfectivo(cant) {
            let actual = parseFloat(document.getElementById('inputRecibido').value) || 0;
            document.getElementById('inputRecibido').value = actual + cant;
            calcularCambio();
        }

        function limpiarEfectivo() {
            document.getElementById('inputRecibido').value = '';
            document.getElementById('lblCambio').innerText = '$0.00';
            document.getElementById('lblCambio').style.color = '#28a745';
            document.getElementById('btnCobrar').disabled = true;
        }

        function calcularCambio() {
            if(!mesaSeleccionada || estadoMesaSeleccionada !== 'sucia') return;
            
            let recibido = parseFloat(document.getElementById('inputRecibido').value) || 0;
            let cambio = recibido - totalAPagar;

            if (cambio >= 0) {
                document.getElementById('lblCambio').innerText = `$${cambio.toFixed(2)}`;
                document.getElementById('lblCambio').style.color = '#28a745';
                document.getElementById('btnCobrar').disabled = false;
            } else {
                document.getElementById('lblCambio').innerText = `Faltan $${Math.abs(cambio).toFixed(2)}`;
                document.getElementById('lblCambio').style.color = '#dc3545';
                document.getElementById('btnCobrar').disabled = true;
            }
        }

        // --- IMPRESIÓN DIRECTA CON IFRAME Y DESBLOQUEO INSTANTÁNEO ---
        function imprimirPrecuenta() {
            if(!mesaSeleccionada || itemsActuales.length === 0) return;
            
            let fecha = new Date().toLocaleString('es-MX');
            let htmlItems = "";
            itemsActuales.forEach(i => {
                let cant = i.CANTIDAD || i.cantidad || 0;
                let nom = String(i.NOMBRE || i.nombre || 'Producto');
                let sub = parseFloat(i.SUBTOTAL || i.subtotal || 0).toFixed(2);
                
                 htmlItems += `
                    <tr>
                        <td style="text-align:left;">${cant}</td>
                        <td style="text-align:left;">${nom.substring(0,18)}</td>
                        <td style="text-align:right;">$${sub}</td>
                    </tr>`;
            });

            let formatoTicket = `
                <html>
                <head>
                   <style>
                        @media print { 
                            @page { margin: 0; size: 50mm auto; } 
                            body { margin: 0;} 
                        }
                        body { 
                            font-family: 'Courier New', Courier, monospace; 
                            width: 48mm; 
                            font-size: 12px; 
                            margin: 0 auto; 
                            color: #000; 
                            background: #fff;
                            padding-top: 0mm; 
                            padding-bottom: 50mm; 
                        }
                        .center { text-align: center; }
                        .bold { font-weight: bold; }
                        .dashed-line { border-bottom: 1px dashed #000; margin: 6px 0; }
                        table { width: 100%; border-collapse: collapse; font-size: 10px; }
                        th { border-bottom: 1px dashed #000; padding-bottom: 2px; text-align: left; }
                        td { padding: 2px 0; vertical-align: top; }
                        .total-area { font-size: 14px; margin-top: 8px; }
                        .desc-producto { width: 55%; word-wrap: break-word; }
                        .cant-col { width: 15%; }
                        .impte-col { width: 30%; text-align: right; }
                    </style>
                </head>
                <body>
                    <div class="center bold" style="font-size: 14px; margin-bottom: 3px;">RESTAURANT SOFTWADZ</div>
                    <div class="center" style="font-size: 9px;">Av. Tecnológico, Ixtlán del Río<br>Nayarit, México<br>Tel: 311 555 1234</div>
                    <div class="dashed-line"></div>
                    <div>Fecha: ${fecha}<br>MESA: <span class="bold">${mesaSeleccionada}</span><br>FOLIO: ${folioActivo}</div>
                    <div class="dashed-line"></div>
                    <table>
                        <thead>
                            <tr>
                                <th class="cant-col">CANT</th>
                                <th class="desc-producto">DESCRIPCIÓN</th>
                                <th class="impte-col">IMPTE</th>
                            </tr>
                        </thead>
                        <tbody>${htmlItems}</tbody>
                    </table>
                    <div class="dashed-line"></div>
                    <div class="total-area bold" style="text-align: right;">TOTAL: $${parseFloat(totalAPagar).toFixed(2)}</div>
                    <div class="dashed-line"></div>
                    <div class="center" style="font-size: 9px;">*** NO FISCAL ***<br>¡Gracias por su preferencia!</div>
                    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
                    .....
                    </body>
                </html>
            `;
            
            let iframe = document.getElementById('marcoImpresora');
            let doc = iframe.contentWindow.document;
            doc.open();
            doc.write(formatoTicket);
            doc.close();
            
            // Actualizar estado y desbloquear caja
            estadoMesaSeleccionada = 'sucia';
            document.getElementById('alertaImpresion').style.display = 'none';
            document.getElementById('inputRecibido').disabled = false;
            document.querySelectorAll('.btn-billete').forEach(b => b.disabled = false);

            // ⭐ Actualizar BASE DE DATOS a 'sucia'
            fetch('../Comedor/actualizar_estado_mesa.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ mesa: mesaSeleccionada, estado: 'sucia' })
            });
            localStorage.setItem('estado_' + mesaSeleccionada, 'sucia');

            setTimeout(() => { 
                iframe.contentWindow.focus();
                iframe.contentWindow.print(); 
                actualizandoMesas = false; 
                cargarMesasPendientes(); 
            }, 500);

            document.getElementById('inputRecibido').focus();
        }

        async function procesarCobroFinal() {
            if(!mesaSeleccionada || estadoMesaSeleccionada !== 'sucia' || !folioActivo) return;
            
            try {
                let formData = new FormData();
                formData.append('folio', folioActivo);

                let req = await fetch('cobrar_cuenta.php', {
                    method: 'POST',
                    body: formData
                });
                
                let res = await req.json();

                if(res.status === 'success') {
                    alert(`✅ COBRO PROCESADO\nMesa liquidada correctamente en el sistema.`);
                    
                    // ⭐ Liberar mesa en la base de datos (CON VERIFICACIÓN)
try {
    let respEstado = await fetch('../Comedor/actualizar_estado_mesa.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ mesa: mesaSeleccionada, estado: 'libre' })
    });
    let jsonEstado = await respEstado.json();
    
    if (jsonEstado.status === 'success') {
        // Solo si se actualizó bien, limpiamos el almacenamiento local
        localStorage.removeItem('cuenta_' + mesaSeleccionada);
        localStorage.setItem('estado_' + mesaSeleccionada, 'libre');
    } else {
        console.error("Error al liberar mesa en BD:", jsonEstado.message);
        alert("⚠️ La mesa se cobró pero no se pudo liberar en el comedor. Error: " + jsonEstado.message);
    }
} catch (error) {
    console.error("Error de red al liberar mesa:", error);
    alert("⚠️ No se pudo contactar al servidor para liberar la mesa. Verifique la conexión.");
}

                    mesaSeleccionada = null;
                    folioActivo = null;
                    document.getElementById('ticketMesaTitulo').innerText = "Seleccione una Mesa";
                    document.getElementById('ticketItemsCaja').innerHTML = '<div style="text-align:center; color:#888; margin-top:50px;">Sin detalles.</div>';
                    document.getElementById('ticketTotalCaja').innerText = "TOTAL: $0.00";
                    document.getElementById('btnImprimir').disabled = true;
                    document.getElementById('alertaImpresion').style.display = 'none';
                    document.getElementById('inputRecibido').disabled = true;
                    document.querySelectorAll('.btn-billete').forEach(b => b.disabled = true);
                    
                    limpiarEfectivo();
                    
                    actualizandoMesas = false;
                    cargarMesasPendientes(); 
                } else {
                    alert("Error en la Base de Datos: " + res.message);
                }

            } catch(e) {
                console.error(e);
                alert("Error de conexión al procesar el cobro.");
            }
        }
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/notificaciones.js"></script>
</body>
</html>
